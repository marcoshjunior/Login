<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <div>
        <h1>Login</h1>
        <p>Digite seus dados para entrar</p>
        <form action="">
          <label for="idnome">E-mail:</label>
          <input type="text" id="idnome" placeholder="seu@email.com" required />
          <label for="idsenha">Senha</label>
          <input
            type="password"
            name="password"
            id="idsenha"
            placeholder="Digite sua senha"
            required
          />
          <button>Login</button>
        </form>
        <a href="#" id="link-esqueceu">Esqueceu a senha?</a>
        <p>Não tem uma conta? <a href="#">Criar conta</a></p>
      </div>
    </main>
  </body>
</html>
